name: Build Windows release installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag matching package.json (for example, v0.2.7)
        required: true
        type: string

concurrency:
  group: windows-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  installer:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      SITEVOICE_TAG: ${{ inputs.release_tag }}
      GH_PROMPT_DISABLED: '1'
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Confirm the target release matches the app version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:SITEVOICE_TAG -cne "v$version") {
            throw 'The release tag must match the app version.'
          }
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:SITEVOICE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne (git rev-parse HEAD)) {
            throw 'The release tag must point to the commit being built.'
          }
          $release = gh release view $env:SITEVOICE_TAG --repo $env:GITHUB_REPOSITORY --json databaseId,isPrerelease,isImmutable,assets |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.databaseId -or $release.isPrerelease -or $release.isImmutable) {
            throw 'The target must be an existing release that accepts new files (draft or stable).'
          }
          $installerName = "SiteVoice-$version-win-x64.exe"
          if ($release.assets.name -contains $installerName) { throw 'The installer already exists.' }
          "SITEVOICE_INSTALLER=release/$installerName" >> $env:GITHUB_ENV
          "SITEVOICE_RELEASE_ID=$($release.databaseId)" >> $env:GITHUB_ENV

      - name: Install dependencies and test application code
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Build Windows x64 installer with MSVC
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Could not find the x64 Visual Studio C++ tools.' }
          $build = Join-Path $env:RUNNER_TEMP 'build-sitevoice.cmd'
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          call npm run package:win
          if errorlevel 1 exit /b 1
          node --test native/test.mjs
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc native\test-win-shortcut.cpp /Fe:"%RUNNER_TEMP%\sitevoice-win-shortcut.exe"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\sitevoice-win-shortcut.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc native\test-win-editor.cpp /Fe:"%RUNNER_TEMP%\sitevoice-win-editor.exe" user32.lib
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\sitevoice-win-editor.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc native\test-win-editor-evidence.cpp /Fe:"%RUNNER_TEMP%\sitevoice-editor-evidence.exe"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\sitevoice-editor-evidence.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /DUNICODE /D_UNICODE native\probe-win-clipboard.cpp /Fe:"%RUNNER_TEMP%\sitevoice-paste-clipboard.exe" user32.lib gdi32.lib ole32.lib oleaut32.lib uiautomationcore.lib crypt32.lib advapi32.lib
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\sitevoice-paste-clipboard.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\probe-win-paste-editor.cpp /Fe:"%RUNNER_TEMP%\sitevoice-paste-editor.exe" user32.lib advapi32.lib
          "@ | Set-Content -LiteralPath $build -Encoding ascii
          & $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify existing Windows installation upgrades, relaunches, and uninstalls
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath $env:SITEVOICE_INSTALLER
          $dest = Join-Path $env:RUNNER_TEMP 'SiteVoiceSmoke'
          $previous = Join-Path $env:RUNNER_TEMP 'SiteVoice-0.2.13-win-x64.exe'
          Invoke-WebRequest 'https://github.com/seominpapa/SiteVoice/releases/download/v0.2.13/SiteVoice-0.2.13-win-x64.exe' -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous).Hash.ToLowerInvariant() -cne '1e621e14d10b599bc458b77f271cfe498b9f433bb5f01a33358d455c8dabcd04') {
            throw 'The previous installer does not match its published digest.'
          }
          $install = Start-Process -FilePath $previous -ArgumentList '/S', '/currentuser', "/D=$dest" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Previous installer exited $($install.ExitCode)." }
          $old = Start-Process -FilePath (Join-Path $dest 'SiteVoice.exe') -PassThru
          Start-Sleep -Seconds 3
          if ($old.HasExited) { throw 'The existing app could not start.' }
          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList '--updated', '/S', '--force-run' -PassThru
          Start-Sleep -Milliseconds 500
          if (!$old.HasExited) { Stop-Process -Id $old.Id }
          if (!$upgrade.WaitForExit(45000) -or $upgrade.ExitCode -ne 0) { throw 'Upgrade installer failed.' }
          $app = Get-Item -LiteralPath (Join-Path $dest 'SiteVoice.exe')
          $helper = Get-Item -LiteralPath (Join-Path $dest 'resources\targets\win32-x64\voice-target.exe')
          if ((Get-FileHash -LiteralPath $helper.FullName).Hash -ne
              (Get-FileHash -LiteralPath 'native/bin/win32-x64/voice-target.exe').Hash) {
            throw 'Installed helper differs from the tested executable.'
          }
          foreach ($file in 'SiteVoice.exe', 'resources\app.asar') {
            $actual = Get-FileHash -LiteralPath (Join-Path $dest $file)
            $expected = Get-FileHash -LiteralPath (Join-Path 'release\win-unpacked' $file)
            if ($actual.Hash -cne $expected.Hash) { throw "Installed $file differs from the tested build." }
          }
          $marker = Get-Content -LiteralPath (Join-Path $dest 'resources\build\windows-update.channel') -Raw
          if ($marker.Trim() -cne 'sitevoice-win-x64-v1') { throw 'Windows update channel is missing.' }
          Start-Sleep -Seconds 5
          $processes = @(Get-Process SiteVoice -ErrorAction SilentlyContinue | Where-Object Path -eq $app.FullName)
          if (!$processes.Count) { throw 'The upgraded app was not relaunched.' }
          foreach ($process in $processes) {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
          $env:SITEVOICE_PROBE_STATUS = Join-Path $env:RUNNER_TEMP 'sitevoice-editor-status.log'
          node native/probe-win-paste.mjs (Join-Path $env:RUNNER_TEMP 'sitevoice-paste-editor.exe') $helper.FullName --expect-fixed
          $probeResult = $LASTEXITCODE
          if (Test-Path -LiteralPath $env:SITEVOICE_PROBE_STATUS) { Get-Content -LiteralPath $env:SITEVOICE_PROBE_STATUS }
          if ($probeResult -ne 0) { throw 'The installed helper failed to insert text in the external Windows editor.' }
          $uninstaller = Get-Item -LiteralPath (Join-Path $dest 'Uninstall SiteVoice.exe')
          $remove = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path -LiteralPath $app.FullName)) { throw 'Uninstall failed.' }
          Get-AuthenticodeSignature -LiteralPath $installer.FullName | Select-Object Status

      - name: Add the verified installer to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item -LiteralPath $env:SITEVOICE_INSTALLER
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release upload $env:SITEVOICE_TAG $installer.FullName --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:SITEVOICE_RELEASE_ID" | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -CEQ $installer.Name
          if ($LASTEXITCODE -ne 0 -or $asset.state -ne 'uploaded' -or $asset.size -ne $installer.Length -or $asset.digest -cne "sha256:$hash") {
            throw 'Published installer does not match the tested file.'
          }
          Write-Output "Verified $($asset.name) (SHA-256: $hash)."
