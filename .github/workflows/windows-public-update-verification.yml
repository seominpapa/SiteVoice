name: Verify published Windows update
on:
  push:
    branches: [codex/sitevoice-windows-update-v0214]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Run the public updater in the installed 0.2.13 app
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $oldVersion = '0.2.13'
          $newVersion = '0.2.14'
          $repo = 'seominpapa/SiteVoice'
          $dest = Join-Path $env:RUNNER_TEMP 'SiteVoicePublicUpdate'
          $exe = Join-Path $dest 'SiteVoice.exe'
          $previous = Join-Path $env:RUNNER_TEMP "SiteVoice-$oldVersion-win-x64.exe"
          $profile = Join-Path $env:APPDATA 'SiteVoice'
          if (Test-Path -LiteralPath $profile) { throw 'The runner already has SiteVoice user data.' }
          Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/v$oldVersion/SiteVoice-$oldVersion-win-x64.exe" -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous).Hash.ToLowerInvariant() -cne '1e621e14d10b599bc458b77f271cfe498b9f433bb5f01a33358d455c8dabcd04') { throw 'Unexpected previous installer.' }
          $setup = Start-Process -FilePath $previous -ArgumentList '/S', '/currentuser', "/D=$dest" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installing the previous app failed.' }

          function Has-AppVersion([string]$version) {
            if (!(Test-Path -LiteralPath $exe)) { return $false }
            $escaped = [regex]::Escape($version)
            (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion -match "^$escaped(?:\.0)?$"
          }
          if (!(Has-AppVersion $oldVersion)) { throw 'Wrong starting app version.' }
          if (Get-Process -Name SiteVoice -ErrorAction SilentlyContinue) { throw 'SiteVoice already running.' }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class SiteVoiceDesktop {
            private delegate bool EnumProc(IntPtr hwnd, IntPtr state);
            [DllImport("user32.dll")] private static extern bool EnumWindows(EnumProc callback, IntPtr state);
            [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out int pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] private static extern int GetWindowText(IntPtr hwnd, StringBuilder name, int length);
            [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll")] private static extern IntPtr SendMessageTimeout(IntPtr hwnd, uint msg, UIntPtr wParam, IntPtr lParam, uint flags, uint timeout, out UIntPtr result);
            public static bool ClickButton(IntPtr hwnd, int expectedPid) {
              int pid;
              GetWindowThreadProcessId(hwnd, out pid);
              UIntPtr result;
              return hwnd != IntPtr.Zero && pid == expectedPid &&
                SendMessageTimeout(hwnd, 0x00F5, UIntPtr.Zero, IntPtr.Zero, 2, 1500, out result) != IntPtr.Zero;
            }
            public static IntPtr[] Windows(int expected, string title) {
              var windows = new List<IntPtr>();
              EnumWindows((window, state) => {
                int pid;
                GetWindowThreadProcessId(window, out pid);
                if (pid != expected || !IsWindowVisible(window)) return true;
                var name = new StringBuilder(192);
                GetWindowText(window, name, name.Capacity);
                if (name.ToString() == title) windows.Add(window);
                return true;
              }, IntPtr.Zero);
              return windows.ToArray();
            }
          }
          '@
          $any = [System.Windows.Automation.Condition]::TrueCondition
          $buttonLabel = ('{"text":"\uc5c5\ub370\uc774\ud2b8 \uc124\uce58"}' | ConvertFrom-Json).text
          $title = ('{"text":"SiteVoice \uc5c5\ub370\uc774\ud2b8"}' | ConvertFrom-Json).text
          $settings = ('{"text":"\ud658\uacbd \uc124\uc815"}' | ConvertFrom-Json).text
          $check = ('{"text":"\uc5c5\ub370\uc774\ud2b8 \ud655\uc778"}' | ConvertFrom-Json).text
          $hasLatest = Invoke-WebRequest -UseBasicParsing 'https://api.github.com/repos/seominpapa/SiteVoice/releases?per_page=100'
          Write-Output "Anonymous feed is HTTP $($hasLatest.StatusCode); rate remaining $($hasLatest.Headers['X-RateLimit-Remaining'])."
          $marker = Join-Path $dest 'resources\build\windows-update.channel'
          if (!(Test-Path $marker) -or (Get-Content $marker -Raw).Trim() -ne 'sitevoice-win-x64-v1') {
            throw 'The public previous app does not have the updater channel.'
          }
          $start = Start-Process -FilePath $exe -ArgumentList '--force-renderer-accessibility' -PassThru
          function Get-Elements($window) {
            $element = [System.Windows.Automation.AutomationElement]::FromHandle($window)
            $element.FindAll([System.Windows.Automation.TreeScope]::Descendants, $any)
          }
          function Invoke-NamedButton($elements, [string]$label, [switch]$nativeFallback) {
            foreach ($element in $elements) {
              if ($element.Current.ControlType -ne [System.Windows.Automation.ControlType]::Button -or
                  $element.Current.Name.Replace('&', '') -ne $label) { continue }
              $invoke = $null
              if ($element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$invoke)) {
                $invoke.Invoke()
                return $true
              }
              if ($nativeFallback -and [SiteVoiceDesktop]::ClickButton([IntPtr]$element.Current.NativeWindowHandle, $start.Id)) {
                return $true
              }
            }
            return $false
          }
          $deadline = (Get-Date).AddSeconds(75)
          $manualAt = (Get-Date).AddSeconds(18)
          $confirmed = $false
          $openedSettings = $false
          $manual = $false
          $lastSeen = @()
          do {
            $windows = @([SiteVoiceDesktop]::Windows($start.Id, $title)) + @([SiteVoiceDesktop]::Windows($start.Id, 'SiteVoice'))
            foreach ($window in $windows) {
              try {
                $elements = @(Get-Elements $window)
                $names = @($elements | ForEach-Object { $_.Current.Name } | Where-Object { $_ })
                if (!($names | Where-Object { $_.Contains($newVersion) }) -or $title -notin $names) { continue }
                if (Invoke-NamedButton $elements $buttonLabel -nativeFallback) {
                  $method = if ($manual) { 'manual check' } else { 'startup check' }
                  Write-Output "Observed the $method prompt for $newVersion in the $oldVersion app and approved it."
                  $confirmed = $true
                  break
                }
              } catch [System.Windows.Automation.ElementNotAvailableException] {}
            }
            if (!$confirmed -and (Get-Date) -gt $manualAt) {
              foreach ($window in [SiteVoiceDesktop]::Windows($start.Id, 'SiteVoice')) {
                try {
                  $elements = @(Get-Elements $window)
                  $lastSeen = @($elements | ForEach-Object { $_.Current.Name } | Where-Object { $_ } | Select-Object -First 25)
                  if (!$openedSettings) { $openedSettings = Invoke-NamedButton $elements $settings }
                  elseif (!$manual) { $manual = Invoke-NamedButton $elements $check }
                } catch [System.Windows.Automation.ElementNotAvailableException] {}
              }
            }
            if (!$confirmed) { Start-Sleep -Milliseconds 500 }
          } while (!$confirmed -and (Get-Date) -lt $deadline -and !$start.HasExited)
          if (!$confirmed) { throw "Could not confirm the real update prompt. Navigation: $openedSettings, manual check: $manual. Observed UI: $($lastSeen -join '; ')" }
          $deadline = (Get-Date).AddSeconds(210)
          do {
            $live = @(Get-Process -Name SiteVoice -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.Id -ne $start.Id -and $_.MainWindowHandle -ne [IntPtr]::Zero })
            if ($start.HasExited -and $live.Count -and (Has-AppVersion $newVersion)) {
              Start-Sleep -Seconds 3
              if (@($live | Where-Object { !(Get-Process -Id $_.Id -ErrorAction SilentlyContinue) }).Count -eq $live.Count) { continue }
              Write-Output "The installed app accepted the public update, replaced $oldVersion with $newVersion, and relaunched."
              exit 0
            }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          throw 'The verified update did not relaunch the new installed version.'
